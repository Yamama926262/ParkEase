
name: ParkEase Automated Tests

on:
  push:

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create report folder
        run: mkdir -p reports

      - name: Run smoke tests and create HTML report
        run: |
          python -m behave --tags=@smoke --format html --outfile reports/behave-report.html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ParkEase-HTML-Report
          path: reports/behave-report.html
          if-no-files-found: warn
